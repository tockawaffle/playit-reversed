name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      PLAYIT_SECURE_WEBAUTH:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Remove local tarball reference for CI
        run: |
          # Remove the local tarball devDependency that doesn't exist in CI
          sed -i '/"playit-reversed": "\.\/playit-reversed-.*\.tgz"/d' package.json

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Pack and install local package
        run: |
          npm pack
          TARBALL=$(ls playit-reversed-*.tgz)
          bun add "./$TARBALL"

      - name: Validate PlayIt API Key
        env:
          PLAYIT_SECURE_WEBAUTH: ${{ secrets.PLAYIT_SECURE_WEBAUTH }}
        run: |
          if [ -z "$PLAYIT_SECURE_WEBAUTH" ]; then
            echo "::error::PLAYIT_SECURE_WEBAUTH secret is not set!"
            echo "Please add PLAYIT_SECURE_WEBAUTH to repository secrets."
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - name: Setup PlayIt environment
        env:
          PLAYIT_SECURE_WEBAUTH: ${{ secrets.PLAYIT_SECURE_WEBAUTH }}
        run: |
          echo "PLAYIT_SECURE_WEBAUTH=$PLAYIT_SECURE_WEBAUTH" > .env
          bun run playit:setup

      - name: Run tests
        run: bun test

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests completed successfully! :white_check_mark:" >> $GITHUB_STEP_SUMMARY
